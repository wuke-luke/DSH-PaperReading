# dsh-paper-studio bundle patch: inserts the dual-face plugin row into the
# profile roster. The node half (exports ".") serves /paper-studio and its API;
# the `dsh.client` declaration in package.json makes the browser half
# (exports "./client") load in the web GUI and register the sidebar panel.
- insert:
    - id: paper-studio
      name: 'dsh-paperreading'
