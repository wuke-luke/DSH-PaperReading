<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>DeepPaperReading</title>
<style>
  :root { --ink: #f4efe4; --accent: #b4565f; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #14120f; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "Iowan Old Style", "Palatino Linotype", "Songti SC", Georgia, serif;
    color: var(--ink);
  }
  .stage { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; }
  .glow {
    position: absolute; width: 620px; height: 620px; border-radius: 50%;
    background: radial-gradient(circle, rgba(180,86,95,.16), transparent 62%);
    opacity: 0; animation: glow 3.4s ease-out .5s forwards;
  }
  @keyframes glow { to { opacity: 1; } }

  .mark { width: 210px; height: 210px; overflow: visible; }
  .mark path, .mark circle, .mark ellipse {
    fill: none; stroke: var(--ink); stroke-width: 1.5;
    stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: var(--len); stroke-dashoffset: var(--len);
    animation: draw var(--dur) cubic-bezier(.6,.05,.2,1) var(--delay) forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .whale { --len: 1530; --dur: 1.15s; --delay: .15s; }
  .book { --len: 260; --dur: .55s; --delay: 1.15s; stroke: var(--accent); }
  .spine { --len: 24; --dur: .3s; --delay: 1.55s; stroke: var(--accent); }

  .wordmark {
    display: flex; gap: 1px; font-size: 52px; letter-spacing: .02em;
    font-weight: 500; opacity: 0; transform: translateY(10px);
    animation: rise .8s cubic-bezier(.2,.7,.3,1) 1.85s forwards;
  }
  .wordmark b { font-weight: 500; color: #fff; }
  .wordmark span { color: var(--accent); font-weight: 500; }

  .tagline {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 15.5px; letter-spacing: .24em; color: rgba(244,239,228,.62);
    opacity: 0; animation: rise .9s ease-out 2.55s forwards;
  }
  .meta {
    position: absolute; bottom: 46px; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 11.5px; letter-spacing: .3em; color: rgba(244,239,228,.34);
    opacity: 0; animation: rise .9s ease-out 3.1s forwards;
  }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  .vim { position: absolute; inset: 0; background: #f7f3ea; opacity: 0; }
  body.fade .vim { animation: fadeIn .5s ease-out forwards; }
  @keyframes fadeIn { to { opacity: 1; } }

  /* end card */
  body.end .mark { animation: none; }
  body.end .mark path, body.end .mark circle, body.end .mark ellipse { animation: none; stroke-dashoffset: 0; }
  body.end .wordmark, body.end .tagline, body.end .meta { animation: none; opacity: 1; transform: none; }
</style>
</head>
<body>
  <div class="stage">
    <div class="glow"></div>
    <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">

      <path class="book" d="M20 79.5c5.4-2.2 10.5-2 14.6 1.1 4-3.1 9.2-3.3 14.6-1.1v13.2c-5.4-2.2-10.5-2-14.6 1.1-4-3.1-9.2-3.3-14.6-1.1z" />

    </svg>
    <div class="wordmark"><b>Deep</b><span>Paper</span><b>Reading</b></div>
    <div class="tagline">在 DeepSeek Harness 里读论文</div>
    <div class="meta">整页对照翻译 · 划词即译 · 伴读对话</div>
  </div>
  <div class="vim"></div>
  <script>
    const params = new URLSearchParams(location.search)
    // Freeze the animation at ?t=<seconds> so frames can be captured exactly,
    // independent of how fast the screenshot round-trip is.
    if (params.has('t')) {
      const t = Number(params.get('t')) || 0
      for (const el of document.querySelectorAll('.mark path, .mark circle, .glow, .wordmark, .tagline, .meta')) {
        el.style.animationDelay = (-t) + 's'
        el.style.animationPlayState = 'paused'
      }
    }
    if (params.has('end')) document.body.classList.add('end')
    window.__intro = { fade: () => document.body.classList.add('fade') }
  </script>
</body>
</html>
